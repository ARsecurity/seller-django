# Render Blueprint: New > Blueprint > pick this repo.
# Render will ask ONLY for the 4 values marked sync:false. Everything else is pre-filled.
services:
  - type: keyvalue
    name: seller-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
  - type: web
    name: seller-zamfara-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /api/health/
    envVars:
      - {key: PYTHON_VERSION, value: 3.12.4}
      - {key: SECRET_KEY, generateValue: true}
      - {key: REDIS_URL, fromService: {type: keyvalue, name: seller-redis, property: connectionString}}
      - {key: FRONTEND_URL, value: "https://seller-zamfara-web.onrender.com"}
      - {key: CORS_ORIGINS, value: "https://seller-zamfara-web.onrender.com"}
      - {key: DATABASE_URL, sync: false}     # 1. Neon connection string
      - {key: ADMIN_USERNAME, sync: false}   # 2.
      - {key: ADMIN_PASSWORD, sync: false}   # 3.
      - {key: ADMIN_EMAIL, sync: false}      # 4.
  - type: web
    name: seller-zamfara-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - {key: NODE_VERSION, value: 20}
      - {key: NEXT_PUBLIC_API_URL, value: "https://seller-zamfara-api.onrender.com"}
      - {key: NEXT_PUBLIC_WS_URL, value: "wss://seller-zamfara-api.onrender.com"}
